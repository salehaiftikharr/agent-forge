# Render Blueprint for the functional Agent Forge (one service + one disk).
# The web app, worker, and Slack bot run together and share the SQLite database
# on the persistent disk at /data. Secrets are set in the Render dashboard
# (sync: false), never committed.
services:
  - type: web
    name: agent-forge
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: starter # $7/mo; has a persistent disk
    healthCheckPath: /api/health
    disk:
      name: forge-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: FORGE_DB_PATH
        value: /data/forge.db
      - key: FORGE_RUNS_DIR
        value: /data/runs
      - key: FORGE_GITHUB
        value: real
      - key: LLM_PROVIDER
        value: anthropic
      # --- secrets: set these in the Render dashboard, do not commit ---
      - key: FORGE_PASSPHRASE # the passphrase to open /work
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GH_TOKEN # fine-grained GitHub token (contents + PR write, issues read)
        sync: false
      - key: FORGE_WEB_URL # public URL, used in Slack run links (set after first deploy)
        sync: false
      # --- optional: Slack shared-engine bot ---
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: FORGE_SLACK_APPROVERS
        sync: false
