<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Forge mark, forging itself">
  <!-- The forge story in one gesture: the die is drawn, the billet is set, the
       ember strikes and settles. SMIL plays inside img tags. The static
       forge-mark.svg is the reduced-motion fallback. -->
  <style>.forge-spark { fill: var(--forge-accent, #ff6a3d); }</style>
  <path fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"
        stroke-dasharray="150" stroke-dashoffset="150"
        d="M9 14 H19 L24 21 L29 14 H39 A4 4 0 0 1 43 18 V39 A4 4 0 0 1 39 43 H9 A4 4 0 0 1 5 39 V18 A4 4 0 0 1 9 14 Z">
    <animate attributeName="stroke-dashoffset" from="150" to="0" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </path>
  <rect x="15" y="31" width="18" height="5" rx="2.5" fill="currentColor" opacity="0" transform="translate(0 5)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" dur="0.5s" begin="1.0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <circle class="forge-spark" cx="24" cy="10" r="0">
    <animate attributeName="r" values="0;5.5;4" dur="0.5s" begin="1.35s" fill="freeze" calcMode="spline" keySplines="0.3 0 0 1; 0.3 0 0.4 1"/>
  </circle>
</svg>
