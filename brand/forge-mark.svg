<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Forge mark">
  <!-- The forge die: a shaping mould with a struck V-notch at the top, an ember
       landing in the notch, and a billet resting inside. Stroke is currentColor;
       the ember stays ember in every theme. Static form for universal rendering;
       use forge-mark-animated.svg for the self-forging draw. -->
  <style>.forge-spark { fill: var(--forge-accent, #ff6a3d); }</style>
  <path fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"
        d="M9 14 H19 L24 21 L29 14 H39 A4 4 0 0 1 43 18 V39 A4 4 0 0 1 39 43 H9 A4 4 0 0 1 5 39 V18 A4 4 0 0 1 9 14 Z"/>
  <rect x="15" y="31" width="18" height="5" rx="2.5" fill="currentColor"/>
  <circle class="forge-spark" cx="24" cy="10" r="4"/>
</svg>
