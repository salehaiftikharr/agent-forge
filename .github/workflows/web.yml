name: web

on:
  push:
    branches: [main, forge-product-rebuild, agent-forge-functional-app]
    paths:
      - "web/**"
      - "src/**"
      - "db/**"
      - "sandbox/**"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "db/**"
      - "sandbox/**"
      - "package-lock.json"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Demo e2e + accessibility (builds the production app, then runs 34 e2e + axe)
        run: npm run test:e2e

  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install engine deps (worker)
        run: npm ci
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Functional e2e (real DB + worker + engine, deterministic provider)
        run: npm run test:e2e:functional
        working-directory: web
